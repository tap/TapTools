<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="sans-serif" font-size="12.5">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#666666"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ff725c"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b8890f"/>
    </marker>
  </defs>

  <text x="16" y="26" fill="#1a1a1a" font-weight="bold">tap.garden~ — events on a loop, bells in a pool, a gardener with a seed</text>

  <!-- plant path: note -> quantize -> event ring -->
  <text x="16" y="102" fill="#1a1a1a">note(pitch, vel)</text>
  <line x1="118" y1="98" x2="144" y2="98" stroke="#666666" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="146" y="80" width="120" height="40" rx="4" fill="none" stroke="#666666" stroke-width="1.4"/>
  <text x="206" y="96" text-anchor="middle" fill="#1a1a1a">quantize</text>
  <text x="206" y="112" text-anchor="middle" fill="#666666" font-size="10">root + scale, at entry</text>
  <line x1="266" y1="98" x2="292" y2="98" stroke="#666666" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- event ring -->
  <rect x="294" y="60" width="240" height="84" rx="6" fill="none" stroke="#666666" stroke-width="1.6"/>
  <text x="414" y="82" text-anchor="middle" fill="#1a1a1a">event ring · 64 blooms</text>
  <text x="414" y="99" text-anchor="middle" fill="#666666" font-size="10.5">each: pitch, velocity, brightness,</text>
  <text x="414" y="112" text-anchor="middle" fill="#666666" font-size="10.5">a position on the loop</text>
  <text x="414" y="132" text-anchor="middle" fill="#666666" font-size="10.5">full → the oldest bloom yields</text>

  <!-- fire path: ring -> fire at loop position -> bell pool -> sum -> level -> out -->
  <line x1="534" y1="98" x2="560" y2="98" stroke="#666666" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="562" y="76" width="118" height="44" rx="4" fill="none" stroke="#4269d0" stroke-width="2"/>
  <text x="621" y="94" text-anchor="middle" fill="#4269d0">fire</text>
  <text x="621" y="110" text-anchor="middle" fill="#666666" font-size="10">when the loop reaches it</text>
  <line x1="680" y1="98" x2="706" y2="98" stroke="#666666" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="708" y="64" width="150" height="72" rx="4" fill="none" stroke="#666666" stroke-width="1.4"/>
  <text x="783" y="86" text-anchor="middle" fill="#1a1a1a">bell pool · 16</text>
  <text x="783" y="103" text-anchor="middle" fill="#666666" font-size="10.5">chime: 4 mode doublets (material), decay_env each</text>
  <text x="783" y="118" text-anchor="middle" fill="#666666" font-size="10.5">tube hash: mode scatter + stereo seat</text>
  <text x="783" y="130" text-anchor="middle" fill="#666666" font-size="10.5">steal = re-aim the quietest, never a reset</text>
  <line x1="858" y1="92" x2="884" y2="92" stroke="#666666" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="858" y1="108" x2="884" y2="108" stroke="#666666" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="891" y="96" fill="#1a1a1a">L</text>
  <text x="891" y="112" fill="#1a1a1a">R</text>

  <!-- per-pass wear (red): back into the ring -->
  <path d="M 621 120 L 621 190 L 546 190" fill="none" stroke="#ff725c" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="330" y="170" width="216 " height="40" rx="4" fill="none" stroke="#ff725c" stroke-width="1.6"/>
  <text x="438" y="186" text-anchor="middle" fill="#ff725c">velocity × decay · brightness × soften</text>
  <text x="438" y="202" text-anchor="middle" fill="#666666" font-size="10">every pass: quieter and purer</text>
  <path d="M 330 190 L 304 190 L 304 146" fill="none" stroke="#ff725c" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="240" y="222" width="306" height="30" rx="4" fill="none" stroke="#ff725c" stroke-width="1.2" stroke-dasharray="1 0"/>
  <text x="393" y="241" text-anchor="middle" fill="#ff725c" font-size="11.5">below the floor → the bloom retires</text>
  <text x="16" y="316" fill="#ff725c" font-size="11">per-pass decay IS the stabilizer: the population converges no matter how fast you plant</text>

  <!-- the gardener (dashed, amber): seeded rng planting into the ring -->
  <rect x="60" y="170" width="180" height="56" rx="4" fill="none" stroke="#b8890f" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="150" y="190" text-anchor="middle" fill="#b8890f">the gardener</text>
  <text x="150" y="206" text-anchor="middle" fill="#666666" font-size="10.5">seeded xorshift64* — after</text>
  <text x="150" y="218" text-anchor="middle" fill="#666666" font-size="10.5">idle_seconds: gusts and calms</text>
  <path d="M 240 184 L 294 130" fill="none" stroke="#b8890f" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ab)"/>
</svg>
